# Generated by Green Room. Customize policy in .greenroom.json, not this gate.
name: Green Room

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  entropy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Green Room
        run: npm ci --ignore-scripts
      - name: Entropy gate (pull request)
        if: github.event_name == 'pull_request'
        env:
          GREENROOM_COMPARE_REF: origin/${{ github.base_ref }}
          GREENROOM_ALLOW_GOVERNANCE_UPDATE: ${{ vars.GREENROOM_ALLOW_GOVERNANCE_UPDATE }}
        run: node src/cli.mjs check
      - name: Entropy gate (push)
        if: github.event_name == 'push'
        env:
          GREENROOM_COMPARE_REF: ${{ github.event.before }}
          GREENROOM_ALLOW_GOVERNANCE_UPDATE: ${{ vars.GREENROOM_ALLOW_GOVERNANCE_UPDATE }}
        run: node src/cli.mjs check
